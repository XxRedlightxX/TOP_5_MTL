name: Laravel + Vue CI v2

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1️⃣ Checkout repository
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2️⃣ Setup PHP
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite
          coverage: none

      # -------------------------
      # 3️⃣ Install backend deps
      # -------------------------
      - name: Install Composer dependencies
        working-directory: Backend
        run: composer install --prefer-dist --no-interaction --no-progress

     # -------------------------
      # 4️⃣ Setup Laravel (.env + SQLite)
      # -------------------------
      - name: Prepare Laravel environment (SQLite)
        working-directory: Backend
        run: |
          mkdir -p database
          touch database/database.sqlite
          
          # 1. Copy to .env.testing specifically
          cp .env.example .env.testing
          
          # 2. Update .env.testing with absolute SQLite path (Crucial for 422 errors)
          DB_PATH=$(pwd)/database/database.sqlite
          sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=sqlite|" .env.testing
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=$DB_PATH|" .env.testing
          
          # 3. Fix Authentication & Sessions (Crucial for 401/403 errors)
          # We use 'file' because 'array' forgets the user immediately after login
          sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=file|" .env.testing
          sed -i "s|SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,127.0.0.1:8000|" .env.testing
          sed -i "s|SESSION_DOMAIN=.*|SESSION_DOMAIN=localhost|" .env.testing
          
          # 4. Ensure other drivers are sync/array for CI speed
          sed -i "s|CACHE_DRIVER=.*|CACHE_DRIVER=array|" .env.testing
          sed -i "s|CACHE_STORE=.*|CACHE_STORE=array|" .env.testing
          sed -i "s|QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|" .env.testing
          
          # 5. Generate key and clear config
          php artisan key:generate --env=testing
          php artisan config:clear --env=testing

      # -------------------------
      # 5️⃣ Run migrations & seeders
      # -------------------------
      - name: Run database migrations
        working-directory: Backend
        run: php artisan migrate:fresh --seed --env=testing --force

      - name: Debug seeders
        working-directory: Backend
        run: |
          php artisan tinker --execute="
            echo config('database.connections.sqlite.database');
            echo '\n--- EXISTING TABLES ---\n' . implode(', ', Schema::getTableListing()) . '\n';
            echo '\n--- TABLE DATA ---\n';
            echo 'Saisons: ' . DB::table('saison')->count() . '\n';
            echo 'Types: ' . DB::table('type')->count() . '\n';
            echo 'Users: ' . DB::table('utilisateur')->count() . '\n';
          "

      # -------------------------
      # 6️⃣ Run Laravel tests
      # -------------------------
      - name: Run backend tests
        id: backend_tests
        working-directory: Backend
        run: php artisan test --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite # This will use the file we touched in step 4


      # -------------------------
      # 7️⃣ Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FrontEnd/package.json

      # -------------------------
      # 8️⃣ Install frontend deps
      # -------------------------
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      # -------------------------
      # 9️⃣ Build Vue frontend
      # -------------------------
      - name: Build frontend
        working-directory: FrontEnd
        run: npm run build

      # -------------------------
      # 🔟 Install Playwright
      # -------------------------
      - name: Install Playwright dependencies
        working-directory: FrontEnd
        run: |
          npm install @playwright/test
          npx playwright install --with-deps

     # -------------------------
      # 1️⃣1️⃣ Start Laravel & Vue
      # -------------------------
      - name: Start Servers
        working-directory: .
        run: |
          cd Backend
          # Explicitly tell 'serve' to use the testing environment
          php artisan serve --env=testing --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &
          
          cd ../FrontEnd
          npm run preview -- --port 3000 > /dev/null 2>&1 & 
          
          until curl -s http://127.0.0.1:8000 > /dev/null; do echo "Waiting for API..."; sleep 2; done
          until curl -s http://localhost:3000 > /dev/null; do echo "Waiting for Vue..."; sleep 2; done

      # -------------------------
      # 1️⃣2️⃣ Run Playwright tests
      # -------------------------
      - name: Run Playwright E2E tests
        working-directory: FrontEnd/Playwright
        run: npx playwright test
        env:
          # This tells Playwright to open the Vue app on 3000
          APP_URL: http://localhost:3000
          NODE_ENV: testing


      # -------------------------
      # 1️⃣3️⃣ Upload Playwright report
      # -------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FrontEnd/playwright-report/
