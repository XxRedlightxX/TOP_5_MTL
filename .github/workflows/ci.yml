name: Laravel + Vue CI v2

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite
          coverage: none

      # 3️⃣ Install backend deps
      - name: Install Composer dependencies
        working-directory: Backend
        run: composer install --prefer-dist --no-interaction --no-progress

      # 4️⃣ Setup Laravel (.env)
      - name: Prepare Laravel environment
        working-directory: Backend
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          
          # Get the absolute path
          ABS_PATH=$(pwd)/database/database.sqlite
          
          # Overwrite the tricky parts
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=$ABS_PATH|" .env
          sed -i "s|APP_URL=.*|APP_URL=http://127.0.0.1:8000|" .env
          sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=file|" .env
          
          php artisan key:generate
          php artisan config:clear

      # 5️⃣ Run migrations
      - name: Run database migrations
        working-directory: Backend
        run: php artisan migrate:fresh --seed

      # 6️⃣ Run Laravel tests
      # Note: Ensure phpunit.xml has DB_DATABASE=database/database.sqlite, NOT :memory:
      - name: Run backend tests
        working-directory: Backend
        run: php artisan test

      # 7️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FrontEnd/package.json

      # 8️⃣ Install frontend deps
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      # 9️⃣ Build Vue frontend
      - name: Build frontend
        working-directory: FrontEnd
        run: npm run build

      # 🔟 Install Playwright
      - name: Install Playwright
        working-directory: FrontEnd
        run: |
          npx playwright install --with-deps

      # 1️⃣1️⃣ Start Laravel server
      - name: Start Laravel development server
        working-directory: Backend
        run: |
          # Start server in background and pipe logs for debugging
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/laravel-server.log 2>&1 &
          
          # Wait until server responds
          timeout 30s bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do echo "Waiting for server..."; sleep 2; done'

      # 1️⃣2️⃣ Run Playwright tests
      - name: Run Playwright E2E tests
        working-directory: FrontEnd
        run: npx playwright test
        env:
          APP_URL: http://127.0.0.1:8000
          NODE_ENV: testing

      # 1️⃣3️⃣ Upload Results
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FrontEnd/playwright-report/

      - name: Upload Laravel Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs
          path: Backend/storage/logs/