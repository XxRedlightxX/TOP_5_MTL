name: Laravel + Vue CI (Secure)

permissions:
  contents: read

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: false

    steps:

    # -------------------------
    # 1. Checkout code
    # -------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # 2. Setup PHP
    # -------------------------
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, sqlite
        coverage: none

    # -------------------------
    # 3. Install backend dependencies securely
    # -------------------------
    - name: Install Composer dependencies
      working-directory: Backend
      run: |
        composer install \
          --prefer-dist \
          --no-interaction \
          --no-progress \
          --no-scripts

        composer audit || true

    # -------------------------
    # 4. Create secure Laravel environment
    # -------------------------
    - name: Prepare Laravel environment securely
      working-directory: Backend
      run: |

        mkdir -p database
        touch database/database.sqlite

        mkdir -p storage/framework/{cache,sessions,views}
        mkdir -p storage/app/public
        chmod -R 775 storage bootstrap/cache

        DB_PATH=$(pwd)/database/database.sqlite

        cat <<EOF > .env.testing
        APP_NAME=Laravel
        APP_ENV=testing
        APP_KEY=${{ secrets.APP_KEY }}
        APP_DEBUG=false
        APP_URL=${{ secrets.APP_URL }}

        LOG_CHANNEL=stack
        LOG_LEVEL=error

        DB_CONNECTION=sqlite
        DB_DATABASE=$DB_PATH

        CACHE_DRIVER=array
        SESSION_DRIVER=file
        QUEUE_CONNECTION=sync

        SANCTUM_STATEFUL_DOMAINS=${{ secrets.SANCTUM_STATEFUL_DOMAINS }}
        SESSION_DOMAIN=${{ secrets.SESSION_DOMAIN }}
        EOF

        php artisan config:clear --env=testing
        php artisan config:cache --env=testing

    # -------------------------
    # 5. Run migrations and seeders
    # -------------------------
    - name: Run database migrations and seeders
      working-directory: Backend
      run: php artisan migrate:fresh --seed --env=testing --force

    # -------------------------
    # 6. Run backend tests
    # -------------------------
    - name: Run backend tests
      working-directory: Backend
      run: php artisan test --env=testing || echo "tests_failed=true" >> $GITHUB_OUTPUT


    # -------------------------
    # 7. Re-seed database for Playwright
    # -------------------------
    - name: Re-seed database for Playwright
      working-directory: Backend
      run: php artisan migrate:fresh --seed --env=testing --force

    # -------------------------
    # 8. Setup Node.js securely
    # -------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: FrontEnd/package.json

    # -------------------------
    # 9. Install frontend dependencies securely
    # -------------------------
    - name: Install frontend dependencies
      working-directory: FrontEnd
      run: |
        npm ci
        npm audit --audit-level=high || true

    # -------------------------
    # 10. Build Vue frontend
    # -------------------------
    - name: Build frontend
      working-directory: FrontEnd
      run: npm run build

    # -------------------------
    # 11. Install Playwright securely
    # -------------------------
    - name: Install Playwright
      working-directory: FrontEnd
      run: |
        npm install --save-dev @playwright/test
        npx playwright install --with-deps

    # -------------------------
    # 12. Start Laravel and Vue servers
    # -------------------------
    - name: Start Servers
      working-directory: 
      run: |
        cd Backend
        # Explicitly tell 'serve' to use the testing environment
        php artisan serve --env=testing --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &
        
        cd ../FrontEnd
        npm run preview -- --port 3000 > /dev/null 2>&1 & 
        
        until curl -s ${{ secrets.APP_URL }} > /dev/null; do echo "Waiting for API..."; sleep 2; done
        until curl -s ${{ secrets.FRONTEND_APP_URL }} > /dev/null; do echo "Waiting for Vue..."; sleep 2; done


    # -------------------------
    # 13. Run Playwright tests
    # -------------------------
    - name: Run Playwright tests
      working-directory: FrontEnd/Playwright
      run: npx playwright test
      env:
        APP_URL: ${{ secrets.FRONTEND_APP_URL }}
        NODE_ENV: testing
        JIRA_HOST: ${{ secrets.JIRA_HOST }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

    # -------------------------
    # 14. Upload Playwright report
    # -------------------------
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: FrontEnd/playwright-report/