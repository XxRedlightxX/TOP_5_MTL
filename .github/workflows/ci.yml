name: Laravel + Vue CI v2

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1️⃣ Checkout repository
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2️⃣ Setup PHP
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite
          coverage: none

      # -------------------------
      # 3️⃣ Install backend deps
      # -------------------------
      - name: Install Composer dependencies
        working-directory: Backend
        run: composer install --prefer-dist --no-interaction --no-progress

      # -------------------------
      # 4️⃣ Setup Laravel (.env)
      # -------------------------
      - name: Prepare Laravel environment (SQLite)
        working-directory: Backend
        run: |
          cp .env.example .env

          echo "APP_NAME=Laravel" >> .env
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "APP_URL=http://localhost" >> .env

          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

          echo "CACHE_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "SESSION_DRIVER=array" >> .env

          mkdir -p database
          touch database/database.sqlite

          php artisan key:generate
          php artisan config:clear
          php artisan cache:clear

      # -------------------------
      # 5️⃣ Run migrations
      # -------------------------
      - name: Run database migrations
        working-directory: Backend
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

      - name: DEBUG — list folders
        run: |
          pwd
          ls -la
          ls -la Backend
          ls -la FrontEnd

      # -------------------------
      # 6️⃣ Run Laravel tests
      # -------------------------
      - name: Run backend tests
        id: backend_tests
        working-directory: Backend
        run: |
          php artisan test || echo "tests_failed=true" >> $GITHUB_OUTPUT
        

      
      
     


      # -------------------------
      # 7️⃣ Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FrontEnd/package.json

      # -------------------------
      # 8️⃣ Install frontend deps
      # -------------------------
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      # -------------------------
      # 9️⃣ Build Vue frontend
      # -------------------------
      - name: Build frontend
        working-directory: FrontEnd
        run: npm run build

      
      # -------------------------
      # 🔟 Install Playwright
      # -------------------------
      - name: Install Playwright dependencies
        working-directory: FrontEnd
        run: |
          npm install @playwright/test
          npx playwright install --with-deps

      # -------------------------
      # 1️⃣1️⃣ Start Laravel server
      # -------------------------
      - name: Start Laravel development server
        working-directory: Backend
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &
          sleep 10  # Give server time to start

# -------------------------
# 1️⃣2️⃣ Run Playwright tests
# -------------------------
      - name: Run Playwright E2E tests
        working-directory: FrontEnd/Playwright
        run: npx playwright test tests ../tests
        env:
          APP_URL: http://127.0.0.1:8000
          NODE_ENV: testing

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: FrontEnd/playwright-report/
