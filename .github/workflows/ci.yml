name: Laravel + Vue CI (Secure)

permissions:
  contents: read

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, sqlite, pdo_sqlite
        coverage: none

    - name: Install Composer dependencies
      working-directory: Backend
      run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

    - name: Prepare Laravel environment
      working-directory: Backend
      run: |
        mkdir -p database
        touch database/database.sqlite
        mkdir -p storage/framework/{cache,sessions,views}
        mkdir -p storage/app/public
        chmod -R 775 storage bootstrap/cache

        DB_PATH=$(pwd)/database/database.sqlite

        cat <<EOF > .env.testing
        APP_NAME=Laravel
        APP_ENV=testing
        APP_KEY=${{ secrets.APP_KEY }}
        APP_DEBUG=true
        APP_URL=http://127.0.0.1:8000
        DB_CONNECTION=sqlite
        DB_DATABASE=$DB_PATH
        SANCTUM_STATEFUL_DOMAINS=127.0.0.1:3000,localhost:3000
        SESSION_DOMAIN=127.0.0.1
        CORS_ALLOWED_ORIGINS=http://127.0.0.1:3000
        LOG_CHANNEL=stack
        CACHE_DRIVER=array
        SESSION_DRIVER=file
        QUEUE_CONNECTION=sync
        EOF

    - name: Run database migrations and seeders
      working-directory: Backend
      run: php artisan migrate:fresh --seed --env=testing --force

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: FrontEnd/package.json

    - name: Install frontend dependencies
      working-directory: FrontEnd
      run: npm ci

    # --- CRITICAL: Environment MUST come BEFORE Build ---
    - name: Prepare Frontend Environment
      working-directory: FrontEnd
      run: |
        cat <<EOF > .env
        VITE_API_BASE_URL=http://127.0.0.1:8000/api/
        VITE_REVERB_APP_KEY=123
        VITE_REVERB_HOST=127.0.0.1
        VITE_REVERB_PORT=8080
        VITE_REVERB_SCHEME=http
        EOF

    - name: Build frontend
      working-directory: FrontEnd
      run: npm run build

    - name: Install Playwright
      working-directory: FrontEnd
      run: npx playwright install --with-deps

    # -------------------------
    # 12. Start Laravel and Vue servers
    # -------------------------
    - name: Start Servers
      run: |
        cd Backend
        php artisan serve --env=testing --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &
        
        cd ../FrontEnd
        # Adding --host 127.0.0.1 ensures Vite binds to the same IP curl is checking
        npm run preview -- --port 3000 --host 127.0.0.1 > /dev/null 2>&1 & 
        
        echo "Checking API on http://127.0.0.1:8000"
        timeout 60s bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do echo "Waiting for API..."; sleep 2; done'
        
        echo "Checking Vue on http://127.0.0.1:3000"
        timeout 60s bash -c 'until curl -s http://127.0.0.1:3000 > /dev/null; do echo "Waiting for Vue..."; sleep 2; done'

    - name: Run Playwright tests
      working-directory: FrontEnd
      run: npx playwright test
      env:
        # Use literal localhost URLs to match the servers we just started
        APP_URL: http://127.0.0.1:3000
        JIRA_HOST: ${{ secrets.JIRA_HOST }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        CI: true

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: FrontEnd/playwright-report/