name: Laravel + Vue CI

# Trigger on push or pull request to any branch
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ secrets.APP_NAME }}
      APP_ENV: ${{ secrets.APP_ENV }}
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_DEBUG: ${{ secrets.APP_DEBUG }}
      APP_URL: ${{ secrets.APP_URL }}
      DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      CACHE_DRIVER: ${{ secrets.CACHE_DRIVER }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, mysql, redis
          ini-values: post_max_size=256M, upload_max_filesize=256M

      # 3️⃣ Install Composer dependencies (Laravel backend)
      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-progress --prefer-dist

      # 4️⃣ Prepare Laravel environment
      - name: Prepare .env and cache config
        working-directory: backend
        run: |
          cp .env.example .env
          echo "APP_NAME=${{ secrets.APP_NAME }}" >> .env
          echo "APP_ENV=${{ secrets.APP_ENV }}" >> .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "APP_DEBUG=${{ secrets.APP_DEBUG }}" >> .env
          echo "APP_URL=${{ secrets.APP_URL }}" >> .env
          echo "DB_CONNECTION=${{ secrets.DB_CONNECTION }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "CACHE_DRIVER=${{ secrets.CACHE_DRIVER }}" >> .env
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          php artisan key:generate
          php artisan config:cache

      # 5️⃣ Run migrations
      - name: Run database migrations
        working-directory: backend
        run: php artisan migrate --force

      # 6️⃣ Run Laravel backend tests
      - name: Run backend tests
        working-directory: backend
        run: php artisan test --no-interaction --env=testing

      # 7️⃣ Setup Node.js for Vue frontend
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 8️⃣ Install frontend dependencies (Vue)
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 9️⃣ Build frontend assets
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 🔟 Optional: run frontend tests if you have them
      # - name: Run frontend tests
      #   working-directory: frontend
      #   run: npm run test
