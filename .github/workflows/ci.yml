name: Laravel + Vue CI v2

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1️⃣ Checkout repository
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2️⃣ Setup PHP
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite
          coverage: none

      # -------------------------
      # 3️⃣ Install backend deps
      # -------------------------
      - name: Install Composer dependencies
        working-directory: Backend
        run: composer install --prefer-dist --no-interaction --no-progress

      # -------------------------
      # 4️⃣ Setup Laravel (.env)
      # -------------------------
      - name: Prepare Laravel environment (SQLite)
        working-directory: Backend
        run: |
          cp .env.example .env

          echo "APP_NAME=Laravel" >> .env
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "APP_URL=http://localhost" >> .env

          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

          echo "CACHE_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "SESSION_DRIVER=array" >> .env

          mkdir -p database
          touch database/database.sqlite

          php artisan key:generate
          php artisan config:clear
          php artisan cache:clear

      # -------------------------
      # 5️⃣ Run migrations
      # -------------------------
      - name: Run database migrations
        working-directory: Backend
        run: php artisan migrate --force

      - name: DEBUG — list folders
        run: |
          pwd
          ls -la
          ls -la Backend
          ls -la FrontEnd

      # -------------------------
      # 6️⃣ Run Laravel tests
      # -------------------------
      - name: Run backend tests
        working-directory: Backend
        run: |
          php artisan test
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        

      - name: Check Exit Status
        run: |
          if [[ "${{ steps.backend_tests.outputs.exit_code }}" -eq 0 ]]; then
            echo "Backend tests passed"
          else
            echo "Backend tests failed"
          fi
      
     


      # -------------------------
      # 7️⃣ Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: FrontEnd/package.json

      # -------------------------
      # 8️⃣ Install frontend deps
      # -------------------------
      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      # -------------------------
      # 9️⃣ Build Vue frontend
      # -------------------------
      - name: Build frontend
        working-directory: FrontEnd
        run: npm run build
